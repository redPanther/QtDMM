app-id: io.github.qtdmm.qtdmm
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qtdmm

finish-args:
  - --device=all
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --allow=bluetooth
  - --system-talk-name=org.bluez

modules:
  - name: hidapi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DHIDAPI_INSTALL_TARGETS=ON
      - -DHIDAPI_WITH_HIDRAW=ON
      - -DHIDAPI_WITH_LIBUSB=OFF
    sources:
      - type: git
        url: https://github.com/libusb/hidapi.git
        branch: master

  - name: qtdmm
    buildsystem: cmake-ninja
    build-options:
      env:
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/app/lib/pkgconfig
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: git
        url: https://github.com/qtdmm/QtDMM.git
        branch: master