<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Generic clamp meter. Template: #FF00FF = primary, #00FFFF = secondary (replaced on load). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .lcd { fill: #C9D3C0; }
    .lcdtext { fill: #2A2E2A; font: bold 30px monospace; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .dark { fill: #1E2124; }
    .bezel { fill: #2B2E32; }
    .line { fill: none; stroke: #E6E8EA; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .dline { fill: none; stroke: #1E2124; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #E6E8EA; font: 10px sans-serif; text-anchor: middle; }
  </style>
  <!-- jaw -->
  <path class="primary" d="M100 6 a74 74 0 0 1 74 74 v40 h-36 v-40 a38 38 0 0 0 -76 0 v40 h-36 v-40 a74 74 0 0 1 74 -74z"/>
  <rect class="dark" x="96" y="2" width="8" height="40"/>
  <!-- trigger -->
  <path class="dark" d="M16 160 q-14 30 0 60 h12 v-60z"/>
  <!-- body -->
  <rect class="primary" x="22" y="116" width="156" height="280" rx="24"/>
  <rect class="secondary" x="34" y="128" width="132" height="256" rx="14"/>
  <rect class="dark" x="44" y="140" width="112" height="58" rx="6"/>
  <rect class="lcd" x="49" y="145" width="102" height="48" rx="3"/>
  <text class="lcdtext" style="font-size:28px" x="100.0" y="178.8" text-anchor="middle">12.3</text>
  <g class="light"><rect x="44" y="208" width="24" height="10" rx="3"/><rect x="74" y="208" width="24" height="10" rx="3"/><rect x="104" y="208" width="24" height="10" rx="3"/><rect x="134" y="208" width="22" height="10" rx="3"/></g>
  <circle class="dark" cx="100" cy="276" r="40"/><circle class="primary" cx="100" cy="276" r="30"/>
  <rect class="light" x="96" y="246" width="8" height="30" rx="3"/>
  <circle class="dark" cx="66" cy="352" r="10"/><circle class="light" cx="66" cy="352" r="3.5"/>
  <circle class="dark" cx="134" cy="352" r="10"/><circle class="light" cx="134" cy="352" r="3.5"/>
</svg>
