<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Generic battery monitor (shunt). Template: #FF00FF = primary, #00FFFF = secondary (replaced on load). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .lcd { fill: #C9D3C0; }
    .lcdtext { fill: #2A2E2A; font-weight: bold; font-size: 30px; font-family: monospace; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .dark { fill: #1E2124; }
    .bezel { fill: #2B2E32; }
    .line { fill: none; stroke: #E6E8EA; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .dline { fill: none; stroke: #1E2124; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #E6E8EA; font-size: 10px; font-family: sans-serif; text-anchor: middle; }
  </style>
  <!-- busbar -->
  <rect class="key" x="4" y="76" width="292" height="48" rx="4"/>
  <circle class="dark" cx="30" cy="100" r="14"/><circle class="light" cx="30" cy="100" r="6"/>
  <circle class="dark" cx="270" cy="100" r="14"/><circle class="light" cx="270" cy="100" r="6"/>
  <!-- housing -->
  <rect class="primary" x="60" y="24" width="180" height="152" rx="14"/>
  <rect class="secondary" x="72" y="36" width="156" height="128" rx="8"/>
  <!-- battery symbol -->
  <rect class="light" x="104" y="64" width="80" height="72" rx="6"/>
  <rect class="light" x="184" y="86" width="10" height="28" rx="2"/>
  <rect class="secondary" x="112" y="72" width="64" height="56" rx="3"/>
  <rect class="primary" x="116" y="76" width="18" height="48"/><rect class="primary" x="138" y="76" width="18" height="48"/>
  <!-- status led -->
  <circle cx="214" cy="52" r="5" fill="#3FA34D"/>
</svg>
