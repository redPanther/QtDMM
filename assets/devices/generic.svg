<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 216 216" width="216" height="216">
  <!-- Generic device (generic: not one model, e.g. bare DTM0660 board, any sigrok SCPI meter). Template: #FF00FF = primary, #00FFFF = secondary, #FFFF00 = outline (replaced at build time; outline dark grey in light design, light in dark design). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .lcd { fill: #C9D3C0; }
    .lcdtext { fill: #2A2E2A; font-weight: bold; font-size: 30px; font-family: monospace; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .dark { fill: #1E2124; }
    .bezel { fill: #2B2E32; }
    .line { fill: none; stroke: #E6E8EA; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .dline { fill: none; stroke: #1E2124; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #E6E8EA; font-size: 10px; font-family: sans-serif; text-anchor: middle; }
  </style>
  <!-- bare PCB with chip and display -->
  <rect class="primary" x="8" y="20" stroke="#FFFF00" stroke-width="2" vector-effect="non-scaling-stroke" width="184" height="160" rx="10"/>
  <rect class="primary" x="8" y="20" width="184" height="160" rx="10"/>
  <rect class="secondary" x="16" y="28" width="168" height="144" rx="6"/>
  <g class="light"><circle cx="28" cy="40" r="5"/><circle cx="172" cy="40" r="5"/><circle cx="28" cy="160" r="5"/><circle cx="172" cy="160" r="5"/></g>
  <rect class="dark" x="40" y="40" width="120" height="50" rx="4"/>
  <rect class="lcd" x="45" y="45" width="110" height="40" rx="2"/>
  <text class="lcdtext" style="font-weight:bold;font-family:monospace;font-size:24px" x="100" y="74" text-anchor="middle">8.888</text>
  <rect class="dark" x="72" y="108" width="56" height="44" rx="3"/>
  <g class="key"><rect x="62" y="114" width="10" height="4"/><rect x="62" y="124" width="10" height="4"/><rect x="62" y="134" width="10" height="4"/><rect x="62" y="144" width="10" height="4"/>
  <rect x="128" y="114" width="10" height="4"/><rect x="128" y="124" width="10" height="4"/><rect x="128" y="134" width="10" height="4"/><rect x="128" y="144" width="10" height="4"/></g>
</svg>
