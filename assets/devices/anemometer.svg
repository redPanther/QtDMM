<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 380" width="200" height="380">
  <!-- Generic anemometer (vane). Template: #FF00FF = primary, #00FFFF = secondary (replaced on load). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .lcd { fill: #C9D3C0; }
    .lcdtext { fill: #2A2E2A; font: bold 30px monospace; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .dark { fill: #1E2124; }
    .bezel { fill: #2B2E32; }
    .line { fill: none; stroke: #E6E8EA; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .dline { fill: none; stroke: #1E2124; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #E6E8EA; font: 10px sans-serif; text-anchor: middle; }
  </style>
  <!-- vane wheel -->
  <circle class="dark" cx="100" cy="76" r="70"/>
  <circle class="key" cx="100" cy="76" r="60"/>
  <g class="light">
    <path d="M100 76 L92 22 A56 56 0 0 1 120 24 Z"/><path d="M100 76 L150 60 A56 56 0 0 1 150 92 Z"/>
    <path d="M100 76 L122 126 A56 56 0 0 1 90 130 Z"/><path d="M100 76 L54 104 A56 56 0 0 1 46 70 Z"/>
    <path d="M100 76 L60 38 A56 56 0 0 1 84 22 Z" />
  </g>
  <circle class="dark" cx="100" cy="76" r="10"/>
  <rect class="dark" x="86" y="140" width="28" height="24"/>
  <rect class="primary" x="30" y="158" width="140" height="218" rx="22"/>
  <rect class="secondary" x="42" y="170" width="116" height="194" rx="14"/>
  <rect class="dark" x="52" y="184" width="96" height="58" rx="6"/>
  <rect class="lcd" x="57" y="189" width="86" height="48" rx="3"/>
  <text class="lcdtext" style="font-size:26px" x="100.0" y="222.1" text-anchor="middle">4.2</text>
  <text class="label" x="100" y="260">m/s</text>
  <g class="key"><rect x="56" y="290" width="26" height="14" rx="4"/><rect x="87" y="290" width="26" height="14" rx="4"/><rect x="118" y="290" width="26" height="14" rx="4"/></g>
</svg>
