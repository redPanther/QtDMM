<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 324 244" width="324" height="244">
  <!-- Generic solar charge controller, top view: body = primary, accent stripe = secondary, heatsink behind (fixed dark grey). Template: #FF00FF = primary, #00FFFF = secondary, #FFFF00 = outline (replaced at build time; outline dark grey in light design, light in dark design). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .sink { fill: #4A4D52; }
    .seam { fill: none; stroke: #000000; stroke-opacity: 0.25; stroke-width: 3; }
  </style>
  <!-- heatsink sticking out left/right (notched) -->
  <path class="sink" stroke="#FFFF00" stroke-width="2" vector-effect="non-scaling-stroke" d="M4 14 H296 V60 h-6 v8 h6 V150 h-6 v8 h6 V206 H4 V158 h6 v-8 h-6 V68 h6 v-8 h-6 Z"/>
  <!-- body -->
  <rect class="primary" stroke="#FFFF00" stroke-width="2" vector-effect="non-scaling-stroke" x="22" y="4" width="256" height="212" rx="18"/>
  <path class="seam" d="M58 10 V210 M242 10 V210"/>
  <!-- logo + text (bars, no lettering) -->
  <rect class="light" x="72" y="34" width="56" height="10" rx="5"/>
  <rect class="light" x="72" y="76" width="140" height="8" rx="3"/>
  <rect class="light" x="72" y="92" width="44" height="14" rx="3"/>
  <!-- accent stripe -->
  <rect class="secondary" x="72" y="120" width="156" height="16"/>
  <!-- terminal panel -->
  <rect style="fill:#8A9096;fill-opacity:0.6" x="104" y="168" width="92" height="40" rx="12"/>
  <g class="light"><circle cx="122" cy="188" r="7"/><circle cx="142" cy="188" r="7"/><circle cx="162" cy="188" r="7"/><circle cx="180" cy="188" r="7"/></g>
  <!-- signal bars + LEDs -->
  <g class="light"><rect x="250" y="150" width="4" height="10"/><rect x="257" y="142" width="4" height="18"/><rect x="264" y="134" width="4" height="26"/></g>
  <circle cx="252" cy="172" r="3" style="fill:#B8BDC2"/><circle cx="260" cy="172" r="3" style="fill:#3F8FD8"/><circle cx="268" cy="172" r="3" style="fill:#B8BDC2"/>
</svg>
