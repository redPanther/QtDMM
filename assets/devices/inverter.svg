<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 324 244" width="324" height="244">
  <!-- Generic inverter: lid on a base plate with mounting ears and a terminal strip. Template: #FF00FF = primary (lid), #00FFFF = secondary (base plate, terminals frame), #FFFF00 = outline (replaced at build time; outline dark grey in light design, light in dark design). -->
  <style>
    .primary { fill: #FF00FF; }
    .secondary { fill: #00FFFF; }
    .light { fill: #E6E8EA; }
    .key { fill: #8A9096; }
    .dark { fill: #1E2124; }
    .line { fill: none; stroke: #E6E8EA; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- base plate with mounting ears -->
  <path class="secondary" stroke="#FFFF00" stroke-width="2" vector-effect="non-scaling-stroke" d="M4 176 h30 v-10 h232 v10 h30 v22 a6 6 0 0 1 -6 6 h-280 a6 6 0 0 1 -6 -6 z"/>
  <circle class="key" cx="18" cy="188" r="5"/><circle class="key" cx="282" cy="188" r="5"/>
  <!-- lid -->
  <rect class="primary" stroke="#FFFF00" stroke-width="2" vector-effect="non-scaling-stroke" x="34" y="20" width="232" height="152" rx="16"/>
  <rect class="light" x="34" y="44" width="232" height="5" fill-opacity="0.55"/>
  <!-- glyph -->
  <path class="line" d="M100 76 h40 M100 92 h8 M118 92 h8 M136 92 h4"/>
  <path class="line" d="M160 104 q10 -20 20 0 t20 0"/>
  <path class="line" d="M96 124 L204 60" style="stroke-width:4"/>
  <!-- terminal strip -->
  <rect class="dark" x="50" y="140" width="200" height="24" rx="3"/>
  <g class="key"><rect x="58" y="146" width="16" height="12" rx="2"/><rect x="82" y="146" width="16" height="12" rx="2"/><rect x="106" y="146" width="16" height="12" rx="2"/><rect x="178" y="146" width="28" height="12" rx="2"/><rect x="214" y="146" width="28" height="12" rx="2"/></g>
</svg>
