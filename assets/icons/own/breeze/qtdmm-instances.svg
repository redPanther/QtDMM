<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#232629; } .ColorScheme-Highlight { color:#3daee9; }</style>
  <!-- a second multimeter: small meter plus a plus sign -->
  <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="1">
    <rect x="2.5" y="1.5" width="11" height="16" rx="1.5"/>
    <rect x="4.5" y="3.5" width="7" height="3"/>
    <circle cx="8" cy="11" r="2"/>
  </g>
  <g class="ColorScheme-Text" fill="currentColor">
    <rect x="7.5" y="9" width="1" height="2"/>
    <circle cx="6" cy="15" r="0.8"/>
    <circle cx="10" cy="15" r="0.8"/>
  </g>
  <g class="ColorScheme-Highlight" fill="currentColor">
    <rect x="16" y="13" width="1" height="7"/>
    <rect x="13" y="16" width="7" height="1"/>
  </g>
</svg>
