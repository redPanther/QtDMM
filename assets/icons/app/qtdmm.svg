<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="25.5 22.5 1536 1536" width="1536" height="1536">
  <title>QtDMM multimeter</title>
  <defs>
    <clipPath id="panel">
      <path d="M268,1095 H350 L830,905 H1320 V1490 H268 Z"/>
    </clipPath>
  </defs>

  <!-- housing -->
  <path d="M192,130 L280,45 H1308 L1395,130 V1536 H192 Z" fill="#000"/>
  <path d="M236,160 L298,88 H1290 L1352,150 V1490 H236 Z" fill="#4b4b4b"/>
  <!-- bevels -->
  <path d="M236,160 L298,88 H1290 L1352,150 L1320,122 H322 L268,180 Z" fill="#747474"/>
  <path d="M236,160 L268,180 V1005 L236,1020 Z" fill="#5c5c5c"/>
  <path d="M1352,150 L1320,122 V805 H1352 Z" fill="#3e3e3e"/>

  <!-- display window -->
  <rect x="338" y="190" width="910" height="580" fill="#2f2f2f"/>
  <path d="M338,770 L382,720 H1205 L1248,770 Z" fill="#6c6c6c"/>
  <path d="M1248,190 L1205,238 V720 L1248,770 Z" fill="#5e5e5e"/>
  <rect x="382" y="238" width="823" height="482" fill="#b5ccb6"/>

  <!-- digits 3.421 -->
  <g fill="#000">
    <!-- 3 -->
    <rect x="440" y="295" width="130" height="38"/>
    <rect x="478" y="391" width="92" height="38"/>
    <rect x="440" y="485" width="130" height="38"/>
    <rect x="532" y="295" width="38" height="228"/>
    <!-- . -->
    <rect x="628" y="484" width="40" height="39"/>
    <!-- 4 -->
    <rect x="757" y="295" width="38" height="135"/>
    <rect x="757" y="392" width="100" height="38"/>
    <rect x="848" y="295" width="38" height="228"/>
    <!-- 2 -->
    <rect x="950" y="295" width="135" height="38"/>
    <rect x="1047" y="295" width="38" height="133"/>
    <rect x="950" y="390" width="135" height="38"/>
    <rect x="950" y="390" width="38" height="133"/>
    <rect x="950" y="485" width="135" height="38"/>
    <!-- 1 -->
    <rect x="1108" y="295" width="39" height="228"/>
  </g>

  <!-- bargraph -->
  <g fill="#000">
    <rect x="438" y="578" width="18" height="90"/>
    <rect x="486" y="600" width="18" height="68"/>
    <rect x="534" y="600" width="18" height="68"/>
    <rect x="582" y="600" width="18" height="68"/>
    <rect x="630" y="600" width="18" height="68"/>
    <rect x="678" y="600" width="18" height="68"/>
    <rect x="726" y="578" width="18" height="90"/>
    <rect x="774" y="600" width="18" height="68"/>
    <rect x="822" y="600" width="18" height="68"/>
  </g>

  <!-- lower panel with the black diagonal edge -->
  <path d="M268,1058 H345 L830,866 H1320 V905 H830 L350,1095 H268 Z" fill="#000"/>
  <path d="M268,1095 H350 L830,905 H1320 V1490 H268 Z" fill="#8c8c8c"/>

  <!-- red P button -->
  <circle cx="386" cy="910" r="97" fill="#e8291b"/>
  <path fill="#fff" fill-rule="evenodd"
        d="M342,860 H414 Q446,860 446,893 Q446,926 414,926 H374 V958 H342 Z
           M374,885 H408 Q417,885 417,893 Q417,901 408,901 H374 Z"/>

  <!-- blue socket -->
  <circle cx="1203" cy="1062" r="93" fill="#1616db"/>
  <g fill="#0c0c8a">
    <rect x="1177" y="990" width="22" height="22" transform="rotate(10 1188 1001)"/>
    <rect x="1223" y="1000" width="22" height="22" transform="rotate(10 1234 1011)"/>
    <rect x="1250" y="1052" width="22" height="22" transform="rotate(10 1261 1063)"/>
    <rect x="1203" y="1104" width="22" height="22" transform="rotate(10 1214 1115)"/>
    <rect x="1150" y="1088" width="22" height="22" transform="rotate(10 1161 1099)"/>
    <rect x="1133" y="1030" width="22" height="22" transform="rotate(10 1144 1041)"/>
  </g>

  <!-- yellow squiggle -->
  <path d="M916,1004 H966 V962 H1024 V986 H990 V1012 H1057 V1052 H1036 V1030 H966 V1030 H916 Z" fill="#f4e030"/>

  <!-- light grey marks -->
  <g fill="#c9c9c9">
    <rect x="680" y="1057" width="90" height="42"/>
    <rect x="866" y="1057" width="44" height="42"/>
    <rect x="530" y="1107" width="44" height="42"/>
    <rect x="1060" y="1107" width="42" height="90"/>
    <rect x="392" y="1200" width="40" height="40"/>
    <rect x="340" y="1250" width="40" height="40"/>
    <rect x="1204" y="1250" width="44" height="90"/>
  </g>

  <!-- yellow bar -->
  <rect x="288" y="1152" width="48" height="338" fill="#f4e030"/>

  <!-- rotary switch scale: grey ring with red, yellow and blue ranges -->
  <g clip-path="url(#panel)">
    <path d="M380,1560 A410,410 0 0 1 1200,1560 L1110,1560 A320,320 0 0 0 470,1560 Z" fill="#c4c4c4"/>
    <!-- red: left end -->
    <path d="M380,1560 A410,410 0 0 1 409,1408 L493,1442 A320,320 0 0 0 470,1560 Z" fill="#e8291b"/>
    <!-- yellow: near the top -->
    <path d="M628,1184 L720,1154 L770,1210 L770,1250 L690,1256 L665,1228 L640,1232 Z" fill="#f4e030"/>
    <!-- blue: right end -->
    <path d="M1080,1250 A410,410 0 0 1 1200,1560 L1110,1560 A320,320 0 0 0 1016,1334 Z" fill="#1616db"/>
  </g>

  <!-- knob -->
  <path d="M455,1490 A290,290 0 0 1 1035,1490 Z" fill="#000"/>
  <path d="M530,1490 A230,215 0 0 1 990,1490 Z" fill="#333"/>
  <line x1="600" y1="1352" x2="686" y2="1446" stroke="#000" stroke-width="64" stroke-linecap="round"/>
  <line x1="600" y1="1352" x2="686" y2="1446" stroke="#fff" stroke-width="40" stroke-linecap="round"/>

  <!-- base -->
  <rect x="192" y="1490" width="1203" height="46" fill="#2b2b2b"/>
</svg>
