protocol: ZotekBLE
decoder: src/device/decoders/zotek.cpp
devices: [ZOTEK ZT-5B, ZOTEK ZT-5BQ, ZOTEK ZT-300AB, ZOTEK ZT-5566SE, ANENG V05B, ANENG ST207, ANENG AN9002, ANENG AN999S]
frames_per_reading: 1
unit_map:                      # spec spelling -> what the decoder emits
  "u": "µ"
sources:
  - "ablage/dmm-tools/docs/research/zotek/reverse-engineered-protocol.md (dmm-tools, GPL-3.0-or-later: from ZOTEK's apps e-Bull V1/V2 and manuals; type 2 checked on a ZOYI ZT-5B, dmm-tools issue 31)"

# Every notification is XORed with a fixed 20-byte key from key byte 0
#   41 21 73 55 A2 C1 32 71 66 AA 3B D0 E2 A8 33 14 20 1A AA BB
# and then starts 5A A5 <type>: on air 1B 84 72/71/70/77 for types 1-4.
# Types 1 and 2 are 10 bytes, type 3 11, type 4 19; no checksum.
#
# Types 1-3: four digits from the left, digit k (0-3) high nibble from byte
# 3+k, low nibble from byte 4+k; bit 4 of byte 3 is the minus, of bytes 4-6
# the point before digits 1-3. Type 4: one glyph per byte, main display in
# bytes 12 (left) to 9 with a leading "1" in byte 13 bits 3+2, the second
# display in bytes 8 to 5. Glyphs, segments a f e DP b g c d from bit 7:
# 0 EB, 1 0A, 2 AD, 3 8F, 4 4E, 5 C7, 6 E7, 7 8A, 8 EF, 9 CF, A EE, E E5,
# F E4, L 61, o 27, u 23, t 65, - 04, blank 00. Annunciators per type in the
# spec's §7.
#
# The first four vectors are the spec's worked examples (§9), decoded by
# ZOTEK's own app code there. The others are SYNTHETIC: built from §6.4 (the
# digit patterns of a ZT-5B's Auto and EF, the -0.6 mA case) and §7, then
# scrambled; they test the decoder's reading of the spec, not a meter. The
# NCV dashes ("----"), neither a number nor a letter display, a blank display
# and a notification longer than its packet are tested in test_decoder --keys.
vectors:
  - source_line: "Type 3, -12.34 V DC, AUTO (spec §9)"
    bytes: 1B 84 70 41 08 5C 7D 7F 66 FA 3A
    reading: {value: "-12.34", unit: "V", range_mode: auto}
    expect: {special: "DC", val: "-12.34"}
  - source_line: "Type 1, 230.5 V AC, HOLD (spec §9)"
    bytes: 1B 84 72 F3 2F 2E E9 D6 66 AA
    reading: {value: "230.5", unit: "V", flags: [HOLD]}
    expect: {special: "AC", val: "230.5", range: ""}
  - source_line: "Type 2, 4.700 kOhm (spec §9)"
    bytes: 1B 84 71 15 3C 2B D9 FA 66 A9
    reading: {value: "4.700", unit: "kOhm"}
    expect: {special: "OH", val: "4.700"}
  - source_line: "Type 4, main 1.2345 V DC, AUTO; second display 50.00 Hz (spec §9)"
    bytes: 1B 84 77 51 F2 2A C9 9A A1 6D 75 5F 5F A6 33 14 20 1A AA
    reading: {value: "1.2345", unit: "V", range_mode: auto}
    expect: {special: "DC", val: "1.2345", val2: "50.00", dval2: 50.0, unit2: "Hz", id2: 1}
  - source_line: "Type 3, Auto across the digits, no unit (digits E0 2E 63 25 07, §6.4)"
    bytes: 1B 84 70 B5 8C A2 17 76 66 AA 3B
    reading: {value: "Auto", unit: ""}
    expect: {val: "Auto", special: ""}
  - source_line: "Type 2, NCV: EF in digits 2-3 as on a ZT-5B (00 E0 E5 04 80, §6.4)"
    bytes: 1B 84 71 55 42 24 36 F1 66 AA
    reading: {value: "EF", unit: ""}
    expect: {val: "EF", special: "NCV"}
  - source_line: "Type 3, OL in kOhm, AUTO (digits 00 E0 6B 01 00, §6.4)"
    bytes: 1B 84 70 51 42 AA 33 71 66 AC 3A
    reading: {value: "OL", unit: "kOhm", range_mode: auto}
    expect: {val: "OL", special: "OH"}
  - source_line: "Type 2, -0.6 mA DC: the minus on a blank first digit (§6.4 implementation notes)"
    bytes: 1B 84 71 45 A2 21 C9 F6 22 AE
    reading: {value: "-0.6", unit: "mA"}
    expect: {special: "DC", val: "-0.6"}
  - source_line: "Type 3, 25 C, HOLD (byte 7 bits 6 and 4)"
    bytes: 1B 84 70 51 A2 61 FF 26 66 AA 3B
    reading: {value: "25", unit: "C", flags: [HOLD]}
    expect: {special: "TE", val: "25"}
