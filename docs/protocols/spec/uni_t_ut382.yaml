protocol: UniTUT382
decoder: src/device/decoders/uni_t_ut382.cpp
devices: [UNI-T UT382]
frames_per_reading: 1
sources:
  - docs/protocols/spec/uni_t_ut382.yaml   # synthetic, see note below

# SYNTHETIC frames built from the layout in ut382.py of
# github.com/parametrek/gm1020 (GPL-3.0): 30 bytes 0x3?, their low nibbles
# in pairs (first one low) give 15 data bytes; CR LF; one more byte (a
# checksum?, 00 here). Data @1..@4 the large display ones..thousands as
# 7-segment codes, bit 7 of @2/@3/@4 the decimal point; @9 x10 (bit 0),
# unit (0x08 lx, 0x04 fc), low battery (bit 4), USB (bit 5); @10 auto range
# (bit 1) and the range (bits 4-7); @11 HOLD 0x10, MAX 0x20, MIN 0x40.
# No capture from a real meter exists yet.
vectors:
  - source_line: "123.4 lx, auto, range 200"
    bytes: 30 30 35 36 3C 3F 3E 35 30 36 30 30 30 30 30 30 30 30 38 32 32 3C 30 30 30 30 30 30 30 30 0D 0A 00
    reading: {value: "123.4", unit: "lx", range_mode: auto}
    expect: {special: "LUX", val: "123.4", port: "illuminance"}
  - source_line: "1.234 lx, auto, range 2"
    bytes: 30 30 35 36 3C 37 3E 35 30 3E 30 30 30 30 30 30 30 30 38 32 32 30 30 30 30 30 30 30 30 30 0D 0A 00
    reading: {value: "1.234", unit: "lx", range_mode: auto}
    expect: {val: "1.234"}
  - source_line: "1999 x10 = 19990 lx, manual, range 20000"
    bytes: 30 30 3D 37 3D 37 3D 37 30 36 30 30 30 30 30 30 30 30 39 32 30 3F 30 30 30 30 30 30 30 30 0D 0A 00
    reading: {value: "19990", unit: "lx", range_mode: manual}
    expect: {val: "19990"}
  - source_line: "12.5 fc, auto, HOLD"
    bytes: 30 30 3D 33 3E 3D 30 36 30 30 30 30 30 30 30 30 30 30 34 32 32 38 30 31 30 30 30 30 30 30 0D 0A 00
    reading: {value: "12.5", unit: "fc", range_mode: auto, flags: [HOLD]}
    expect: {val: "12.5", port: "illuminance"}
  - source_line: "overload \" 0L \", auto"
    bytes: 30 30 30 30 3B 30 3B 37 30 30 30 30 30 30 30 30 30 30 38 32 32 3F 30 30 30 30 30 30 30 30 0D 0A 00
    reading: {value: "OL", unit: "lx", range_mode: auto}
    expect: {val: "OL"}
  - source_line: "500 lx, auto, MAX, low battery"
    bytes: 30 30 3B 37 3B 37 3D 33 30 30 30 30 30 30 30 30 30 30 38 33 32 3E 30 32 30 30 30 30 30 30 0D 0A 00
    reading: {value: "500", unit: "lx", range_mode: auto}
    expect: {val: "500"}

skipped:
  - source_line: "menu USB on the display"
    bytes: 30 32 30 30 30 30 30 30 30 30 30 30 30 30 30 30 30 30 38 32 32 30 30 30 30 30 30 30 30 30 0D 0A 00
    reason: >-
      Data byte @0 is 0x20: the meter shows its menu, not a reading.
