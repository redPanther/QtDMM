protocol: BenetechGM1020
decoder: src/device/decoders/benetech_gm1020.cpp
devices: [Benetech GM1020]
frames_per_reading: 1
sources:
  - docs/protocols/spec/benetech_gm1020.yaml   # synthetic, see note below

# SYNTHETIC frames built from the layout in gm1020.py of
# github.com/parametrek/gm1020 (GPL-3.0): 33 22 <lux hi> <lux lo> 01
# <temp hi> <temp lo> 11; lux = low 12 bits / 10, bit 14 x10, bit 15 x100
# (no decimal then); temperature in tenths of °C. No capture from a real
# meter exists yet.
vectors:
  - source_line: "123.4 lx, 23.5 C"
    bytes: 33 22 04 D2 01 00 EB 11
    reading: {value: "123.4", unit: "lx"}
    expect: {special: "LUX", val: "123.4", val2: "23.5", unit2: "C", dval2: 23.5, id2: 1, port: "illuminance", port2: "temperature"}
  - source_line: "x10: 1234 lx, 23.5 C"
    bytes: 33 22 44 D2 01 00 EB 11
    reading: {value: "1234", unit: "lx"}
    expect: {val: "1234"}
  - source_line: "x100: 40000 lx, 30.0 C"
    bytes: 33 22 8F A0 01 01 2C 11
    reading: {value: "40000", unit: "lx"}
    expect: {val: "40000", dval2: 30.0}
