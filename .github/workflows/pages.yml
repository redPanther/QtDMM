name: GitHub Pages

# Builds the whole site https://qtdmm.github.io/QtDMM/ and publishes it:
#   /         landing page (assets/pages)
#   /api/     Doxygen developer documentation, built from master
#   /repos/   own package repositories: the signed Flatpak repository, made
#             from the newest release bundles (a page saying "not online yet"
#             while there is no signing key or no release with a bundle)
#   404.html  sends old links to API pages (/QtDMM/classFoo.html) to api/
# Every deployment replaces the whole site, so everything is built here in one
# job, on every merge and on every published release. Pages must be set to
# "Source: GitHub Actions" in the repository settings.

on:
  push:
    branches: [ "master" ]
    paths:
      - "src/**"
      - "docs/dev/**"
      - "docs/user/scpi-server.md"
      - "Doxyfile"
      - "assets/pages/**"
      - "assets/icons/app/qtdmm.svg"
      - "tools/build-flatpak-repo.sh"
      - ".github/workflows/pages.yml"
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer merge waits instead of cancelling a
# deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # forks have no Pages site for this
    if: github.repository == 'qtdmm/QtDMM'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: master      # also for a release: the API pages always show master
        fetch-depth: 0   # tags: the version shown on the pages comes from git describe

    - name: Install Doxygen
      run: |
        sudo apt update
        sudo apt install -y doxygen graphviz

    - name: Run Doxygen
      # the checked-in Doxyfile plus the version; no CMake or Qt needed
      run: |
        version=$(git describe --tags --abbrev=7 --always)
        mkdir -p build/doxygen   # doxygen creates only the last level
        ( cat Doxyfile; echo "PROJECT_NUMBER = $version" ) | doxygen -

    - name: Put the site together
      run: |
        mkdir site
        cp -r assets/pages/. site/
        cp assets/icons/app/qtdmm.svg site/
        cp -r build/doxygen/html site/api

    # The repository key (secret REPO_GPG_KEY, an armored secret key without
    # passphrase) is checked on every run and its public part published as
    # repos/qtdmm.gpg. stable: the newest release with a Flatpak bundle; beta:
    # the newest pre-release with one, when it is newer than that release.
    # Without the key or a bundle the step leaves the "not online yet" page
    - name: Flatpak repository
      env:
        GH_TOKEN: ${{ github.token }}
        REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
      run: |
        if [ -z "$REPO_GPG_KEY" ]; then
          echo "::notice::no REPO_GPG_KEY: no Flatpak repository on the site"
          mv site/repos/pending.html site/repos/index.html
          exit 0
        fi
        export GNUPGHOME=$(mktemp -d)
        trap 'rm -rf "$GNUPGHOME"' EXIT
        echo "$REPO_GPG_KEY" | gpg --batch --quiet --import
        key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
        [ -n "$key" ] || { echo "::error::REPO_GPG_KEY holds no secret key"; exit 1; }
        # a passphrase or an expired key would only show when signing
        echo test | gpg --batch --pinentry-mode error --local-user "$key" --sign > /dev/null \
          || { echo "::error::the repository key cannot sign (passphrase? expired?)"; exit 1; }
        expires=$(gpg --list-keys --with-colons "$key" | awk -F: '/^pub/ { print $7; exit }')
        [ -n "$expires" ] && expires=$(date -u -d "@$expires" +%F) || expires=never
        echo "repository key $key, expires: $expires"
        gpg --export "$key" > site/repos/qtdmm.gpg

        mkdir -p bundles
        stable=- beta=-
        for row in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 \
                       --json tagName,isPrerelease --jq '.[] | "\(.tagName),\(.isPrerelease)"'); do
          tag=${row%,*} pre=${row#*,}
          name="QtDMM-${tag}-x86_64.flatpak"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -qx "$name" || continue
          if [ "$pre" = true ]; then
            [ "$beta" = - ] || continue   # only the newest pre-release
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir bundles
            beta="bundles/$name"
          else
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir bundles
            stable="bundles/$name"
            break
          fi
        done
        if [ "$stable" = - ] && [ "$beta" = - ]; then
          echo "::notice::no release has a Flatpak bundle yet"
          mv site/repos/pending.html site/repos/index.html
          exit 0
        fi
        sudo apt update
        sudo apt install -y flatpak ostree
        tools/build-flatpak-repo.sh "$stable" "$beta" site/repos/flatpak "$key" \
          "https://qtdmm.github.io/QtDMM/repos/flatpak"
        [ "$beta" != - ] || sed -i '/data-beta/d' site/repos/index.html
        rm -f site/repos/pending.html

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
