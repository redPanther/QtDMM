name: Nix build

# Builds flake.nix, so that it keeps up with CMakeLists.txt. nixpkgs is
# pinned in flake.lock; `nix flake update` moves it on.

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

    - name: Build
      run: nix build -L

    - name: Start
      run: QT_QPA_PLATFORM=offscreen ./result/bin/qtdmm --version

    - name: Development shell
      run: nix develop --command cmake --version

