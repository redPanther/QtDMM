name: Nix build

# Builds flake.nix, so that it keeps up with CMakeLists.txt. A run without
# flake.lock in the repository locks nixpkgs and offers the lock file as an
# artifact to commit.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31

    - name: Lock file present?
      run: test -f flake.lock || echo "NEW_LOCK=1" >> "$GITHUB_ENV"

    - name: Build
      run: nix build -L

    - name: Start
      run: QT_QPA_PLATFORM=offscreen ./result/bin/qtdmm --version

    - name: Development shell
      run: nix develop --command cmake --version

    - name: Lock file
      if: env.NEW_LOCK == '1'
      uses: actions/upload-artifact@v4
      with:
        name: flake.lock
        path: flake.lock
