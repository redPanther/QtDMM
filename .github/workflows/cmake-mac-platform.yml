name: macOS test build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:   # from release.yml for a version tag
    inputs:
      release:
        description: "also build the universal (arm64 + x86_64) .dmg for the release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags and history: the version comes from git describe

    # The official Qt, not Homebrew's: Homebrew splits Qt into many
    # prefixes, which macdeployqt cannot resolve, and its bottles only run on
    # the runner's macOS. This Qt is universal (arm64 + x86_64) and runs on
    # macOS 13 and later; hidapi is built from source by CMake, as on Windows.
    # Not 6.8: the open-source 6.8 releases link the AGL framework, which the
    # current macOS SDK no longer has ("framework 'AGL' not found").
    # Pushes and PRs build, test and package arm64 only (the runner's
    # architecture); the universal build doubles every compile, the tests
    # included, so only a release makes it, without tests.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        modules: 'qtserialport qtcharts'
        cache: true

    - name: Configure
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DQTDMM_WERROR=ON
        -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=arm64

    - name: Build
      run: cmake --build build --parallel

    - name: Check the bundle icon
      working-directory: ${{github.workspace}}/
      run: |
        test -f build/qtdmm.app/Contents/Resources/qtdmm.icns
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/qtdmm.app/Contents/Info.plist)" = qtdmm.icns

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Build universal (release only)
      if: inputs.release
      run: |
        cmake -S . -B build-universal -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DQTDMM_WERROR=OFF \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
        cmake --build build-universal --parallel

    # The .dmg: Qt and hidapi copied into the bundle (macdeployqt), signed
    # ad hoc (Apple Silicon refuses to start unsigned code), no Developer ID
    # and no notarisation - Gatekeeper asks once, see docs/user/troubleshooting.md
    - name: Package
      working-directory: ${{github.workspace}}/
      env:
        BUILD_DIR: ${{ inputs.release && 'build-universal' || 'build' }}
        DMG: ${{ inputs.release && 'QtDMM-macos-universal.dmg' || 'QtDMM-macos-arm64.dmg' }}
      run: |
        rm -rf stage packages && mkdir -p stage packages
        cp -R "$BUILD_DIR/qtdmm.app" stage/QtDMM.app
        macdeployqt stage/QtDMM.app -always-overwrite
        # every library the bundle uses is inside it or part of macOS
        find stage/QtDMM.app -type f -print0 | xargs -0 file | grep Mach-O | cut -d: -f1 > machos.txt
        wc -l < machos.txt
        if xargs otool -L < machos.txt | grep -E '^\s+/' | grep -v -E '^\s+/(System/Library|usr/lib)/'; then
          echo "::error::the bundle links against libraries outside the bundle"; exit 1
        fi
        lipo -archs stage/QtDMM.app/Contents/MacOS/qtdmm
        codesign --force --deep --sign - stage/QtDMM.app
        codesign --verify --deep --strict stage/QtDMM.app
        otool -l stage/QtDMM.app/Contents/MacOS/qtdmm | grep -A3 LC_BUILD_VERSION | grep minos
        ln -s /Applications stage/Applications
        hdiutil create -volname QtDMM -srcfolder stage -ov -format UDZO "packages/$DMG"

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: QtDMM-macos
        path: packages/*.dmg
